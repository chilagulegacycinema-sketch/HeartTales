<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEARTALES - Kitabu cha Mapenzi</title>
<link rel="icon" href="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Dancing+Script:wght@700&family=Cormorant+Garamond:wght@400;700&display=swap');
    :root {--bg:#010101; --card:#F5F0E6; --border:#C0B49A; --pink-neon:#FF00F5; --purple-neon:#A100FF; --text:#2B2B2B; --book-shadow: rgba(0,0,0,0.3);}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', serif; display: flex; justify-content: center; }
.app-container { width: 100%; max-width: 500px; background: #000; display: flex; flex-direction: column; height: 100%; }

.header { background: #05050A; padding: 10px 16px; border-bottom: 2px solid var(--pink-neon); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; box-shadow: 0 0 15px var(--pink-neon); }
.logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.logo img { width: 35px; height: 35px; border-radius: 10px; object-fit: cover; border: 2px solid var(--pink-neon); }
.logo h1 { font-size: 18px; font-weight: 900; font-family: 'Dancing Script', cursive; color: var(--pink-neon); }

.live-status { display: flex; align-items: center; gap: 5px; font-size: 9px; color: #FF0040; font-weight: 900; font-family: Orbitron; }

.category-bar { display: flex; gap: 6px; padding: 8px 10px; background: #05050A; justify-content: center; }
.category-btn { padding: 4px 10px; border-radius: 15px; border: 1px solid var(--pink-neon); background: transparent; color: var(--pink-neon); font-family: Orbitron; font-weight: 700; font-size: 10px; cursor: pointer; }
.category-btn.active { background: var(--pink-neon); color: #000; }

.book-container { flex: 1; display: flex; justify-content: center; align-items: center; background: linear-gradient(to bottom, #1a1a1a, #000); perspective: 2000px; }
.book { width: 95%; height: 90%; position: relative; transform-style: preserve-3d; }
.page { width: 100%; height: 100%; position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 5px 15px 15px 5px; box-shadow: 0 5px 20px var(--book-shadow); padding: 25px 20px; overflow-y: auto; transform-origin: left; transition: transform 0.8s ease; background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 20px 100%; }
.page h2 { font-family: 'Dancing Script', cursive; font-size: 24px; color: var(--pink-neon); text-align: center; margin-bottom: 15px; }
.page img { width: 100%; border-radius: 5px; margin-bottom: 15px; }
.page p { font-size: 16px; line-height: 1.8; text-align: justify; }
.page-num { position: absolute; bottom: 15px; right: 20px; font-family: Orbitron; font-size: 10px; color: #888; }

.page.flipped { transform: rotateY(-180deg); }
.page.next { z-index: 2; }

.admin-login { display: none; flex-direction: column; padding: 30px 20px; gap: 15px; text-align: center; justify-content: center; height: 100%; background: #000; }
.admin-login img { width: 80px; height: 80px; border-radius: 15px; margin: 0 auto; border: 2px solid var(--pink-neon); }
.admin-login input { width: 100%; background: var(--card); border: 1px solid var(--pink-neon); color: #000; padding: 12px; border-radius: 8px; font-family: 'Orbitron'; text-align: center; }
.admin-login button { background: linear-gradient(90deg, var(--pink-neon), var(--purple-neon)); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; font-family: 'Orbitron'; }

.profile-page { display: none; flex-direction: column; height: 100%; background: #000; }
.profile-header { padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
.profile-header img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--pink-neon); }
.admin-tabs { display: flex; gap: 5px; padding: 8px; background: #05050A; }
.tab-btn { flex: 1; padding: 6px; font-size: 9px; border: 1px solid var(--pink-neon); background: transparent; color: var(--pink-neon); border-radius: 8px; cursor: pointer; font-family: Orbitron; }
.tab-btn.active { background: var(--pink-neon); color: #000; }
.tab-content { display: none; padding: 15px; flex-direction: column; gap: 10px; overflow-y: auto; }
.tab-content.active { display: flex; }
.artist-input { width: 100%; background: var(--card); border: 1px solid var(--border); color: #000; padding: 10px; border-radius: 8px; font-family: 'Cormorant Garamond'; font-size: 14px; }
.post-btn { background: linear-gradient(135deg, var(--pink-neon), var(--purple-neon)); color: #000; border: none; border-radius: 8px; padding: 10px; cursor: pointer; font-weight: 900; font-family: 'Orbitron'; }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<div id="mainApp" class="app-container">
    <div class="header">
        <div class="logo" id="logoClick">
            <img src="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png">
            <h1>HEART<span style="color:var(--purple-neon);">TALES</span></h1>
        </div>
        <div class="live-status"><span id="liveCount">0 ONLINE</span></div>
    </div>

    <div class="category-bar" id="categoryBar">
        <button class="category-btn active" onclick="loadBook('all')">ZOTE</button>
        <button class="category-btn" onclick="loadBook('Love')">❤️ Love</button>
        <button class="category-btn" onclick="loadBook('Inspiration')">✨ Inspo</button>
    </div>

    <div id="bookView" class="book-container">
        <div class="book" id="book">
            <p style="color:#888; text-align:center; padding-top:50px;">Chagua kitabu cha kusoma...</p>
        </div>
    </div>

    <div id="adminLogin" class="admin-login">
        <img src="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png">
        <h2 style="color:var(--pink-neon); font-family: Dancing Script;">ADMIN LOGIN</h2>
        <input type="text" id="adminName" placeholder="Jina: YStar Pro">
        <input type="text" id="adminPfp" placeholder="Link ya Picha yako">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="loginAdmin()">INGIA</button>
        <button onclick="backToBook()" style="background:#555;">RUDI</button>
    </div>

    <div id="profilePage" class="profile-page">
        <div class="profile-header">
            <button class="post-btn" onclick="backToBook()" style="background:#555; margin-bottom:10px; width:100%;">← RUDI KWENYE VITABU</button>
            <img id="profilePagePfp" src=""><h2 id="profilePageName" style="color:var(--pink-neon);"></h2>
        </div>
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="openTab('postTab')">ANDIKA</button>
            <button class="tab-btn" onclick="openTab('manageTab')">VITABU VYANGU</button>
            <button class="tab-btn" onclick="openTab('settingsTab')">SETTINGS</button>
        </div>
        <div id="postTab" class="tab-content active">
            <h3 style="color:var(--pink-neon);">ANDIKA KITABU KIPYA</h3>
            <input type="text" id="bookTitle" class="artist-input" placeholder="Jina la Kitabu/Story">
            <select id="bookCategory" class="artist-input"><option value="Love">❤️ Love</option><option value="Inspiration">✨ Inspiration</option></select>
            <textarea id="bookContent" class="artist-input" placeholder="Andika story yako hapa. Tumia [PAGE] kutenganisha page mpya" rows="8"></textarea>
            <input type="text" id="bookCover" class="artist-input" placeholder="Link ya Cover ya Kitabu">
            <button class="post-btn" onclick="publishBook()">CHAPISHA KITABU</button>
        </div>
        <div id="manageTab" class="tab-content"><h3 style="color:var(--pink-neon);">VITABU VYANGU</h3><div id="myBooksList"></div></div>
        <div id="settingsTab" class="tab-content">
            <h3 style="color:var(--pink-neon);">SETTINGS</h3>
            <input type="text" id="newAdminName" class="artist-input" placeholder="Jina Jipya">
            <input type="text" id="newAdminPfp" class="artist-input" placeholder="Picha Jipya">
            <input type="password" id="newAdminPass" class="artist-input" placeholder="Password Mpya">
            <button class="post-btn" onclick="updateAdminInfo()">HIFADHI</button>
            <button class="post-btn" onclick="logout()" style="background:#FF0040;">TOKA ADMIN</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = ""; let currentPfp = ""; let isAdmin = false; let clickCount = 0; let adminPass = "ystar123"; let currentBookPages = []; let currentPageIndex = 0;

    document.getElementById('logoClick').addEventListener('click', () => { clickCount++; if(clickCount >= 5) { clickCount = 0; document.getElementById('bookView').style.display = 'none'; document.getElementById('adminLogin').style.display = 'flex'; } });

    function loginAdmin() { let name = adminName.value.trim(); let pfp = adminPfp.value.trim(); let pass = adminPass.value.trim(); if(pass !== adminPass) { alert("Password sio sahihi"); return; } if(!name || !pfp) { alert("Jaza jina na picha"); return; } currentUser = name; currentPfp = pfp; isAdmin = true; localStorage.setItem('heartAdmin', name); localStorage.setItem('heartPfp', pfp); enterAdmin(); }
    function enterAdmin() { adminLogin.style.display = 'none'; profilePage.style.display = 'flex'; categoryBar.style.display = 'none'; profilePagePfp.src = currentPfp; profilePageName.innerHTML = currentUser; newAdminName.value = currentUser; newAdminPfp.value = currentPfp; loadMyBooks(); }
    function backToBook() { adminLogin.style.display = 'none'; profilePage.style.display = 'none'; bookView.style.display = 'flex'; categoryBar.style.display = 'flex'; }
    function openTab(tabId) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); event.target.classList.add('active'); }
    function logout() { localStorage.clear(); location.reload(); }

    function publishBook() {
        let pages = bookContent.value.split('[PAGE]');
        let data = {title: bookTitle.value, category: bookCategory.value, author: currentUser, authorPfp: currentPfp, cover: bookCover.value, pages: pages, timestamp: Date.now()};
        db.ref("hearttales_books").push().set(data); alert("Kitabu kimechapishwa!"); document.querySelectorAll('.artist-input').forEach(i => i.value = "");
    }

    function loadBook(category) {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active');
        book.innerHTML = "Inapakia..."; 
        let query = category === 'all' ? db.ref("hearttales_books").limitToLast(1) : db.ref("hearttales_books").orderByChild("category").equalTo(category).limitToLast(1);
        query.once("value", snap => { 
            snap.forEach(child => { let bookData = child.val(); currentBookPages = bookData.pages; renderBook(bookData); });
        });
    }

    function renderBook(bookData) {
        book.innerHTML = "";
        currentBookPages.forEach((pageContent, index) => {
            let pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.id = 'page-' + index;
            if(index > 0) pageDiv.style.zIndex = 100 - index;
            pageDiv.innerHTML = `
                ${index === 0 && bookData.cover ? `<img src="${bookData.cover}">` : ""}
                <h2>${bookData.title}</h2>
                <p>${pageContent}</p>
                <div class="page-num">Page ${index + 1} / ${currentBookPages.length}</div>
            `;
            pageDiv.addEventListener('click', () => flipPage(index));
            book.appendChild(pageDiv);
        });
    }

    function flipPage(index) {
        let page = document.getElementById('page-' + index);
        if(page && !page.classList.contains('flipped')) {
            page.classList.add('flipped');
            page.style.zIndex = 200 + index;
        } else if(page) {
            page.classList.remove('flipped');
            page.style.zIndex = 100 - index;
        }
    }

    function loadMyBooks() { /* sawa na za juu */ }
    function updateAdminInfo() { /* sawa na za juu */ }

    // Anza kwa kupakia kitabu cha mwisho
    loadBook('all');
</script>
</body>
</html>
