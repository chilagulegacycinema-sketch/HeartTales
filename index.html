<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEARTALES - Kitabu cha Mapenzi</title>
<link rel="icon" href="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png">
<style>
/* ... style zote zile za juu ... */
.live-status { display: flex; align-items: center; gap: 5px; font-size: 9px; color: #00FF88; font-weight: 900; font-family: Orbitron; padding: 4px 8px; background: rgba(0,255,136,0.1); border-radius: 12px; }
.live-dot { width: 8px; height: 8px; background: #00FF88; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<div id="mainApp" class="app-container">
    <div class="header">
        <div class="logo" id="logoClick">
            <img src="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png">
            <h1>HEART<span style="color:var(--purple-neon);">TALES</span></h1>
        </div>
        <div class="live-status"><div class="live-dot"></div><span id="liveCount">0 ONLINE</span></div>
    </div>

    <!-- ... code yote ya kitabu na admin kama ilivyo ... -->

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = ""; let currentPfp = ""; let isAdmin = false; let clickCount = 0; let adminPass = "ystar123"; 
    let currentBookPages = []; let currentPageIndex = 0; let userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    // ===== HAPA NDIO CODE MPYA YA ONLINE =====
    function setupOnlineStatus() {
        let userRef = db.ref("hearttales_online/" + userId);
        let connectedRef = db.ref(".info/connected");
        
        connectedRef.on("value", (snap) => {
            if (snap.val() === true) {
                // Tukiingia tuweke 1
                userRef.set(true);
                // Tukitoka ifutwe moja kwa moja
                userRef.onDisconnect().remove();
            }
        });

        // Hesabu watu wote walio online
        db.ref("hearttales_online").on("value", (snap) => {
            let count = snap.numChildren();
            document.getElementById('liveCount').innerText = count + " ONLINE";
        });
    }
    // ===== MWISHO WA CODE YA ONLINE =====

    document.getElementById('logoClick').addEventListener('click', () => { clickCount++; if(clickCount >= 5) { clickCount = 0; document.getElementById('bookView').style.display = 'none'; document.getElementById('adminLogin').style.display = 'flex'; } });

    function loginAdmin() { let name = adminName.value.trim(); let pfp = adminPfp.value.trim(); let pass = adminPass.value.trim(); if(pass !== adminPass) { alert("Password sio sahihi"); return; } if(!name || !pfp) { alert("Jaza jina na picha"); return; } currentUser = name; currentPfp = pfp; isAdmin = true; localStorage.setItem('heartAdmin', name); localStorage.setItem('heartPfp', pfp); enterAdmin(); }
    function enterAdmin() { adminLogin.style.display = 'none'; profilePage.style.display = 'flex'; categoryBar.style.display = 'none'; profilePagePfp.src = currentPfp; profilePageName.innerHTML = currentUser; newAdminName.value = currentUser; newAdminPfp.value = currentPfp; loadMyBooks(); }
    function backToBook() { adminLogin.style.display = 'none'; profilePage.style.display = 'none'; bookView.style.display = 'flex'; categoryBar.style.display = 'flex'; }
    function openTab(tabId) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); event.target.classList.add('active'); }
    function logout() { db.ref("hearttales_online/" + userId).remove(); localStorage.clear(); location.reload(); } // Tunaondoa kwenye online tukitoka

    function publishBook() { let pages = bookContent.value.split('[PAGE]'); let data = {title: bookTitle.value, category: bookCategory.value, author: currentUser, authorPfp: currentPfp, cover: bookCover.value, pages: pages, timestamp: Date.now()}; db.ref("hearttales_books").push().set(data); alert("Kitabu kimechapishwa!"); document.querySelectorAll('.artist-input').forEach(i => i.value = ""); }

    function loadBook(category) { document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); book.innerHTML = "Inapakia..."; let query = category === 'all' ? db.ref("hearttales_books").limitToLast(1) : db.ref("hearttales_books").orderByChild("category").equalTo(category).limitToLast(1); query.once("value", snap => { snap.forEach(child => { let bookData = child.val(); currentBookPages = bookData.pages; renderBook(bookData); }); }

    function renderBook(bookData) { book.innerHTML = ""; currentBookPages.forEach((pageContent, index) => { let pageDiv = document.createElement('div'); pageDiv.className = 'page'; pageDiv.id = 'page-' + index; if(index > 0) pageDiv.style.zIndex = 100 - index; pageDiv.innerHTML = `${index === 0 && bookData.cover ? `<img src="${bookData.cover}">` : ""}<h2>${bookData.title}</h2><p>${pageContent}</p><div class="page-num">Page ${index + 1} / ${currentBookPages.length}</div>`; pageDiv.addEventListener('click', () => flipPage(index)); book.appendChild(pageDiv); }); }
    function flipPage(index) { let page = document.getElementById('page-' + index); if(page && !page.classList.contains('flipped')) { page.classList.add('flipped'); page.style.zIndex = 200 + index; } else if(page) { page.classList.remove('flipped'); page.style.zIndex = 100 - index; } }
    function loadMyBooks() { }
    function updateAdminInfo() { let newName = newAdminName.value; let newPfp = newAdminPfp.value; let newPass = newAdminPass.value; if(newName) currentUser = newName; if(newPfp) currentPfp = newPfp; if(newPass) adminPass = newPass; localStorage.setItem('heartAdmin', currentUser); localStorage.setItem('heartPfp', currentPfp); profilePageName.innerHTML = currentUser; profilePagePfp.src = currentPfp; alert("Mabadiliko yamehifadhiwa!"); }

    // ANZA
    setupOnlineStatus(); // Hii ndio inaanzisha kuhesabu
    loadBook('all');
    
    // Kama unarudi kutoka admin
    if(localStorage.getItem('heartAdmin')) { currentUser = localStorage.getItem('heartAdmin'); currentPfp = localStorage.getItem('heartPfp'); isAdmin = true; enterAdmin(); }
</script>
</body>
</html>
