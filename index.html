<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HEARTALES - Kitabu cha Mapenzi</title>
<link rel="icon" href="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Dancing+Script:wght@700&family=Cormorant+Garamond:wght@400;700&display=swap');
    :root {--bg:#010101; --card:#F5F0E6; --border:#C0B49A; --pink-neon:#FF00F5; --purple-neon:#A100FF; --text:#2B2B2B; --book-shadow: rgba(0,0,0,0.3); --success:#00FF88; --error:#FF0040;}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', serif; }
    
/* BADILIKO KUBWA HAPA: TUMEONDOA MAX-WIDTH NA CENTER */
.app-container { width: 100vw; height: 100vh; background: #000; display: flex; flex-direction: column; }

.header { background: #05050A; padding: 10px 16px; border-bottom: 2px solid var(--pink-neon); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; box-shadow: 0 0 15px var(--pink-neon); }
.logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.logo img { width: 35px; height: 35px; border-radius: 10px; object-fit: cover; border: 2px solid var(--pink-neon); }
.logo h1 { font-size: 18px; font-weight: 900; font-family: 'Dancing Script', cursive; color: var(--pink-neon); }

.live-status { display: flex; align-items: center; gap: 5px; font-size: 9px; color: var(--success); font-weight: 900; font-family: Orbitron; padding: 3px 8px; background: rgba(0,255,136,0.1); border-radius: 10px; }
.live-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.category-bar { display: flex; gap: 5px; padding: 6px 10px; background: #05050A; justify-content: center; }
.category-btn { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--pink-neon); background: transparent; color: var(--pink-neon); font-family: Orbitron; font-weight: 700; font-size: 9px; cursor: pointer; }
.category-btn.active { background: var(--pink-neon); color: #000; }
.category-btn svg { width: 10px; height: 10px; fill: currentColor; }

.book-container { flex: 1; display: flex; justify-content: center; align-items: center; background: linear-gradient(to bottom, #1a1a1a, #000); perspective: 2000px; }
.book { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; } /* BOOK SASA NI FULL */
.page { width: 100%; height: 100%; position: absolute; background: var(--card); border: none; border-radius: 0; box-shadow: none; padding: 25px 20px; overflow-y: auto; transform-origin: left; transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1.000); background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 20px 100%; }
.page h2 { font-family: 'Dancing Script', cursive; font-size: 24px; color: var(--pink-neon); text-align: center; margin-bottom: 15px; }
.page img { width: 100%; border-radius: 5px; margin-bottom: 15px; }
.page p { font-size: 16px; line-height: 1.8; text-align: justify; }
.page-num { position: absolute; bottom: 15px; right: 20px; font-family: Orbitron; font-size: 10px; color: #888; }
.page-author { position: absolute; bottom: 15px; left: 20px; font-size: 10px; color: #888; display: flex; align-items: center; gap: 4px; }

.page.flipped { transform: rotateY(-180deg); }

.admin-login { display: none; flex-direction: column; padding: 30px 20px; gap: 15px; text-align: center; justify-content: center; height: 100%; width: 100%; background: #000; }
.admin-login img { width: 80px; height: 80px; border-radius: 15px; margin: 0 auto; border: 2px solid var(--pink-neon); }
.admin-login input { width: 100%; background: var(--card); border: 1px solid var(--pink-neon); color: #000; padding: 12px; border-radius: 8px; font-family: 'Orbitron'; text-align: center; }
.admin-login button { background: linear-gradient(90deg, var(--pink-neon), var(--purple-neon)); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; font-family: 'Orbitron'; }

.profile-page { display: none; flex-direction: column; height: 100%; width: 100%; background: #000; }
.profile-header { padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
.profile-header img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--pink-neon); object-fit: cover; }
.admin-tabs { display: flex; gap: 5px; padding: 8px; background: #05050A; }
.tab-btn { display: flex; align-items: center; justify-content: center; gap: 4px; flex: 1; padding: 6px; font-size: 9px; border: 1px solid var(--pink-neon); background: transparent; color: var(--pink-neon); border-radius: 8px; cursor: pointer; font-family: Orbitron; }
.tab-btn.active { background: var(--pink-neon); color: #000; }
.tab-btn svg { width: 10px; height: 10px; fill: currentColor; }
.tab-content { display: none; padding: 15px; flex-direction: column; gap: 10px; overflow-y: auto; }
.tab-content.active { display: flex; }
.artist-input { width: 100%; background: var(--card); border: 1px solid var(--border); color: #000; padding: 10px; border-radius: 8px; font-family: 'Cormorant Garamond'; font-size: 14px; }
.post-btn { display: flex; align-items: center; justify-content: center; gap: 5px; background: linear-gradient(135deg, var(--pink-neon), var(--purple-neon)); color: #000; border: none; border-radius: 8px; padding: 10px; cursor: pointer; font-weight: 900; font-family: 'Orbitron'; font-size: 12px; }
.danger-btn { background: var(--error); }
.success-btn { background: var(--success); color: #000; }
.book-item { background: var(--card); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.book-item button { padding: 5px 8px; font-size: 9px; margin-left: 5px; }
.v-badge { width: 12px; height: 12px; background: #0095F6; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; }
.v-badge svg { width: 8px; height: 8px; fill: #fff; }
.icon { width: 12px; height: 12px; fill: currentColor; }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<div id="mainApp" class="app-container">
    <!-- ... MWILI WOTE NI SAWA NA ULE WA ZAMANI ... -->
    <!-- Nimeweka tu CSS iliyorekebishwa hapo juu -->
    <!-- Copy code yote ya JS kutoka V4.1 iliyopita -->
</div>

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = ""; let currentPfp = ""; let isAdmin = false; let clickCount = 0; let adminPass = "ystar123"; 
    let currentBookPages = []; let currentPageIndex = 0; let userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    let editingBookId = null;

    function setupOnlineStatus() {
        let userRef = db.ref("hearttales_online/" + userId);
        let connectedRef = db.ref(".info/connected");
        connectedRef.on("value", (snap) => { if (snap.val() === true) { userRef.set(true); userRef.onDisconnect().remove(); } });
        db.ref("hearttales_online").on("value", (snap) => { document.getElementById('liveCount').innerText = snap.numChildren() + " ONLINE"; });
    }

    document.getElementById('logoClick').addEventListener('click', () => { clickCount++; if(clickCount >= 5) { clickCount = 0; bookView.style.display = 'none'; adminLogin.style.display = 'flex'; } });

    function loginAdmin() { 
        let name = adminName.value.trim(); let pfp = adminPfp.value.trim(); let pass = adminPassInput.value.trim(); 
        if(pass !== adminPass) { alert("Password sio sahihi"); return; }
        if(!name || !pfp) { alert("Jaza jina na picha"); return; } 
        currentUser = name; currentPfp = pfp; isAdmin = true; 
        localStorage.setItem('heartAdmin', name); localStorage.setItem('heartPfp', pfp); localStorage.setItem('heartPass', pass);
        enterAdmin(); 
    }
    function enterAdmin() { 
        adminLogin.style.display = 'none'; profilePage.style.display = 'flex'; categoryBar.style.display = 'none'; 
        profilePagePfp.src = currentPfp; profilePageName.innerHTML = currentUser + ' <span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>';
        newAdminName.value = currentUser; newAdminPfp.value = currentPfp; newAdminPass.value = adminPass;
        loadMyBooks(); loadPaymentSettings();
    }
    function backToBook() { adminLogin.style.display = 'none'; profilePage.style.display = 'none'; bookView.style.display = 'flex'; categoryBar.style.display = 'flex'; }
    function openTab(tabId) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); event.target.classList.add('active'); }
    function logout() { db.ref("hearttales_online/" + userId).remove(); localStorage.clear(); location.reload(); }

    function publishBook() {
        if(!isAdmin) return;
        let pages = bookContent.value.split('[PAGE]');
        let data = {title: bookTitle.value, category: bookCategory.value, author: currentUser, authorPfp: currentPfp, cover: bookCover.value, pages: pages, timestamp: Date.now()};
        if(editingBookId) { db.ref("hearttales_books/" + editingBookId).update(data); alert("Kitabu kimehaririwa"); editingBookId = null; }
        else { db.ref("hearttales_books").push().set(data); alert("Kitabu kimechapishwa"); }
        document.querySelectorAll('.artist-input').forEach(i => i.value = "");
        loadMyBooks();
    }

    function loadBooks(category) {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active');
        book.innerHTML = "Inapakia vitabu..."; 
        let query = category === 'all' ? db.ref("hearttales_books").limitToLast(5) : db.ref("hearttales_books").orderByChild("category").equalTo(category).limitToLast(5);
        query.once("value", snap => { 
            book.innerHTML = "";
            if(!snap.exists()) { book.innerHTML = "<p style='color:#888;text-align:center;padding-top:50px;'>Hakuna vitabu kwenye category hii</p>"; return; }
            snap.forEach(child => { let bookData = child.val(); bookData.id = child.key; let div = document.createElement('div'); div.className = 'book-cover'; div.style.cssText = "width:95%;height:120px;background:#222;border:1px solid var(--pink-neon);margin:10px auto;border-radius:8px;padding:10px;cursor:pointer;text-align:center;color:var(--pink-neon)"; div.innerHTML = `<b>${bookData.title}</b><br><small>Na: ${bookData.author}</small>`; div.onclick = () => renderBook(bookData); book.appendChild(div); });
        });
    }

    function renderBook(bookData) {
        book.innerHTML = "";
        currentBookPages = bookData.pages;
        currentBookPages.forEach((pageContent, index) => {
            let pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.id = 'page-' + index;
            if(index > 0) pageDiv.style.zIndex = 100 - index;
            pageDiv.innerHTML = `
                ${index === 0 && bookData.cover ? `<img src="${bookData.cover}">` : ""}
                <h2>${bookData.title}</h2>
                <p>${pageContent}</p>
                <div class="page-author"><img src="${bookData.authorPfp}" style="width:15px;height:15px;border-radius:50%;"> ${bookData.author} <span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span></div>
                <div class="page-num">Ukurasa ${index + 1} / ${currentBookPages.length}</div>
            `;
            pageDiv.addEventListener('click', () => flipPage(index));
            book.appendChild(pageDiv);
        });
    }

    function flipPage(index) {
        let page = document.getElementById('page-' + index);
        if(page && !page.classList.contains('flipped')) {
            page.classList.add('flipped');
            page.style.zIndex = 200 + index;
        } else if(page) {
            page.classList.remove('flipped');
            page.style.zIndex = 100 - index;
        }
    }

    function loadMyBooks() { 
        myBooksList.innerHTML = "Inapakia...";
        db.ref("hearttales_books").orderByChild("author").equalTo(currentUser).once("value", snap => {
            myBooksList.innerHTML = "";
            snap.forEach(child => {
                let data = child.val();
                myBooksList.innerHTML += `<div class="book-item"><span>${data.title}</span><div><button class="post-btn" onclick="editBook('${child.key}')"><svg class="icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> Hariri</button><button class="post-btn danger-btn" onclick="deleteBook('${child.key}')"><svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> Futa</button></div></div>`;
            });
        });
    }
    function editBook(id) { db.ref("hearttales_books/" + id).once("value", snap => { let data = snap.val(); editingBookId = id; bookTitle.value = data.title; bookCategory.value = data.category; bookContent.value = data.pages.join('[PAGE]'); bookCover.value = data.cover; openTab('postTab'); }); }
    function deleteBook(id) { if(confirm("Una uhakika kufuta kitabu hiki?")) db.ref("hearttales_books/" + id).remove().then(() => loadMyBooks()); }

    function updateAdminInfo() { 
        let newName = newAdminName.value; let newPfp = newAdminPfp.value; let newPass = newAdminPass.value; 
        if(newName) currentUser = newName; if(newPfp) currentPfp = newPfp; if(newPass) adminPass = newPass; 
        localStorage.setItem('heartAdmin', currentUser); localStorage.setItem('heartPfp', currentPfp); localStorage.setItem('heartPass', adminPass);
        profilePageName.innerHTML = currentUser + ' <span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>'; profilePagePfp.src = currentPfp; alert("Mabadiliko yamehifadhiwa"); 
    }
    function savePayment() { let ads = adsenseCode.value; let mpesa = mpesaNumber.value; db.ref("hearttales_settings/payment").set({adsense: ads, mpesa: mpesa}); alert("Mipangilio ya malipo imehifadhiwa"); }
    function loadPaymentSettings() { db.ref("hearttales_settings/payment").once("value", snap => { let d = snap.val(); if(d){ adsenseCode.value = d.adsense || ""; mpesaNumber.value = d.mpesa || ""; } }); }

    setupOnlineStatus();
    loadBooks('all');
    if(localStorage.getItem('heartAdmin')) { currentUser = localStorage.getItem('heartAdmin'); currentPfp = localStorage.getItem('heartPfp'); adminPass = localStorage.getItem('heartPass') || "ystar123"; isAdmin = true; enterAdmin(); }
</script>
</body>
</html>
