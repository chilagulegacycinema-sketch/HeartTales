<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INEVITABLE - THE GAME</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root { --bg:#000; --red:#FF0040; --text:#E0E0E0; --glitch:#00F0FF; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Orbitron'; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; }

    .screen { width:100%; max-width:500px; text-align:center; padding:20px; }

    .setup h1 { color:var(--red); font-size:32px; text-shadow:0 0 15px var(--red); animation:glitch 2s infinite; letter-spacing:3px; }
    @keyframes glitch { 0%,100%{text-shadow:0 0 10px var(--red);} 50%{text-shadow:2px 0 var(--glitch), -2px 0 var(--red);} }

    .warning { background:rgba(255,0,64,0.1); border:2px solid var(--red); padding:15px; margin:20px 0; border-radius:8px; font-size:11px; line-height:1.6; }
    .warning strong { color:var(--red); }

    .player-inputs input { width:100%; background:#111; border:1px solid var(--red); color:#fff; padding:14px; margin:8px 0; border-radius:5px; font-family:Orbitron; text-align:center; font-size:14px; }
    .player-inputs input:focus { outline:none; box-shadow:0 0 10px var(--red); }
    
    .start-btn { width:100%; background:var(--red); color:#000; border:none; padding:16px; font-weight:900; font-size:18px; cursor:pointer; margin-top:15px; letter-spacing:2px; }
    .start-btn:disabled { background:#333; color:#666; cursor:not-allowed; }

    .game-screen { display:none; }
    .players-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0; }
    .player-card { background:#111; border:2px solid #333; padding:18px; border-radius:8px; transition:0.6s; font-weight:700; }
    .player-card.scanned { border-color:var(--red); background:rgba(255,0,64,0.3); box-shadow:0 0 20px var(--red); animation:shake 0.5s; }
    .player-card.eliminated { opacity:0; transform:scale(0) rotate(180deg); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    .scanner { font-size:20px; color:var(--red); margin:15px 0; letter-spacing:2px; }
    .timer { font-size:50px; color:var(--glitch); font-weight:900; text-shadow:0 0 15px var(--glitch); }
    .shoot-btn { background:var(--red); color:#000; border:none; padding:22px; font-size:20px; font-weight:900; width:100%; cursor:pointer; display:none; letter-spacing:3px; margin-top:20px; }
    .shoot-btn:hover { box-shadow:0 0 30px var(--red); }

    .red-flash { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,0,64,0.5); pointer-events:none; display:none; z-index:9999; }
</style>
</head>
<body>

<div class="red-flash" id="redFlash"></div>

<!-- SCREEN 1: SETUP -->
<div class="screen setup" id="setupScreen">
    <h1>INEVITABLE</h1>
    <div class="warning">
        <strong>RULES:</strong><br>
        1. PLAYERS MUST BE EXACTLY 7<br>
        2. ONCE THE GAME STARTS, THERE IS NO ESCAPE<br>
        3. THIS IS A SIMULATION FOR FILM PURPOSES ONLY
        <br><br>
        <small>Kumbuka: Hii ni system ya kupiga film tu. Hakuna mtu anayepotea kweli</small>
    </div>
    <p style="margin-bottom:10px;">ENTER 7 PLAYER NAMES</p>
    <div class="player-inputs" id="playerInputs"></div>
    <button class="start-btn" id="startBtn" onclick="startGame()" disabled>INITIATE GAME</button>
</div>

<!-- SCREEN 2: GAME -->
<div class="screen game-screen" id="gameScreen">
    <h2 style="color:var(--red); letter-spacing:2px;">THE GAME HAS BEGUN</h2>
    <div class="scanner" id="scannerText">SCANNING TARGET...</div>
    <div class="timer" id="timer">15</div>
    <div class="players-grid" id="playersGrid"></div>
    <button class="shoot-btn" id="shootBtn" onclick="shootPlayer()">ELIMINATE TARGET</button>
</div>

<!-- AUDIO FILES -->
<audio id="scanSound" src="https://freesound.org/data/previews/270/270404_5123851-lq.mp3" preload="auto"></audio>
<audio id="alarmSound" src="https://freesound.org/data/previews/456/456588_9498993-lq.mp3" preload="auto"></audio>
<audio id="heartbeat" src="https://freesound.org/data/previews/244/244563_4301841-lq.mp3" preload="auto" loop></audio>
<audio id="elimSound" src="https://freesound.org/data/previews/320/320181_5260872-lq.mp3" preload="auto"></audio>

<script>
    const requiredPlayers = ["ZORAVALY","PAUL","SHANIYA","WILLIAMS","IRENE","MASON","PAUL2"];
    let players = [];
    let currentScanIndex = 0;
    let scanInterval;
    let countdown = 15;

    const scanSound = document.getElementById('scanSound');
    const alarmSound = document.getElementById('alarmSound');
    const heartbeat = document.getElementById('heartbeat');
    const elimSound = document.getElementById('elimSound');
    const redFlash = document.getElementById('redFlash');

    // Tengeneza input 7
    const inputsDiv = document.getElementById('playerInputs');
    for(let i=0; i<7; i++){
        inputsDiv.innerHTML += `<input type="text" id="p${i}" placeholder="PLAYER ${i+1}" oninput="checkInputs()">`;
    }

    function checkInputs(){
        let filled = 0;
        for(let i=0; i<7; i++){
            if(document.getElementById('p'+i).value.trim()!== "") filled++;
        }
        document.getElementById('startBtn').disabled = filled!== 7;
    }

    function startGame(){
        players = [];
        for(let i=0; i<7; i++){
            players.push({name: document.getElementById('p'+i).value.toUpperCase(), alive:true});
        }

        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';

        heartbeat.play(); // Anza moyo kupiga
        renderPlayers();
        startScanning();
    }

    function renderPlayers(){
        let grid = document.getElementById('playersGrid');
        grid.innerHTML = "";
        players.forEach((p,i)=>{
            if(p.alive){
                grid.innerHTML += `<div class="player-card" id="player${i}">${p.name}</div>`;
            }
        });
    }

    function flashRed(){
        redFlash.style.display = 'block';
        setTimeout(()=> redFlash.style.display = 'none', 200);
    }

    function startScanning(){
        scanInterval = setInterval(()=>{
            flashRed();
            scanSound.currentTime = 0;
            scanSound.play();

            if(currentScanIndex > 0){
                let prev = document.getElementById('player'+(currentScanIndex-1));
                if(prev) prev.classList.remove('scanned');
            }

            if(currentScanIndex < players.length){
                let current = document.getElementById('player'+currentScanIndex);
                if(current) current.classList.add('scanned');
                document.getElementById('scannerText').innerText = `SCANNING: ${players[currentScanIndex].name}`;
                currentScanIndex++;
                resetTimer();
            } else {
                clearInterval(scanInterval);
                heartbeat.pause();
                alarmSound.play();
                document.getElementById('scannerText').innerText = "GAME ACTIVE - SELECT TARGET";
                document.getElementById('shootBtn').style.display = 'block';
            }
        }, 15000); // kila sekunde 15
        runTimer();
    }

    function runTimer(){
        countdown = 15;
        document.getElementById('timer').innerText = countdown;
        let t = setInterval(()=>{
            countdown--;
            document.getElementById('timer').innerText = countdown;
            if(countdown <= 0) clearInterval(t);
        }, 1000);
    }
    function resetTimer(){ runTimer(); }

    function shootPlayer(){
        let alivePlayers = players.filter(p=>p.alive);
        if(alivePlayers.length > 0){
            let target = alivePlayers[0]; // unabadilisha manually ukiwa unashoot
            let index = players.findIndex(p=>p.name === target.name);
            players[index].alive = false;
            
            elimSound.play();
            flashRed();
            document.getElementById('player'+index).classList.add('eliminated');
            
            setTimeout(()=>renderPlayers(), 600);
            alert(`TARGET ELIMINATED: ${target.name}`);
        }
    }
</script>
</body>
</html>
