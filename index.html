<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INEVITABLE - FILM SYSTEM</title>
<link rel="icon" href="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root {
        --bg:#010101; --card:#0A0A12; --border:#1E1E2E;
        --blue-neon:#00F0FF; --pink-neon:#FF00F5; --green-neon:#00FF88; --text:#E0E0FF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; justify-content: center; overflow: hidden; }

    .app-container { width: 100%; max-width: 500px; background: #000; border: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
    
    .header { background: #05050A; padding: 12px 16px; border-bottom: 2px solid var(--pink-neon); display: flex; justify-content: space-between; align-items: center; }
    .logo h1 { font-size: 18px; font-weight: 900; color: var(--pink-neon); text-shadow: 0 0 8px var(--pink-neon); }
    .scene-count { font-size:11px; color:var(--green-neon); border:1px solid var(--green-neon); padding:4px 10px; border-radius:4px; }

    .top-tabs { display:flex; background:#05050A; }
    .tab-btn { flex:1; padding:10px; background:transparent; border:none; color:var(--blue-neon); font-weight:900; cursor:pointer; font-size:10px; font-family:Orbitron; }
    .tab-btn.active { background:var(--pink-neon); color:#000; }

    .tab-content { display:none; flex:1; flex-direction:column; padding:15px; overflow-y:auto; }
    .tab-content.active { display:flex; }

    /* CAST TAB */
    .actor-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .actor-card { background:var(--card); border:1px solid var(--border); padding:15px; border-radius:8px; text-align:center; cursor:pointer; }
    .actor-card.active { border-color:var(--pink-neon); box-shadow:0 0 10px var(--pink-neon); }
    .actor-card img { width:60px; height:60px; border-radius:50%; border:2px solid var(--blue-neon); margin-bottom:5px; }

    /* SCRIPT TAB */
    .scene-box { background:var(--card); border-left:3px solid var(--pink-neon); padding:15px; margin-bottom:10px; border-radius:5px; }
    .scene-title { color:var(--blue-neon); font-weight:900; margin-bottom:5px; }
    .dialogue { font-size:14px; line-height:1.8; }
    .choice-btn { width:100%; background:linear-gradient(90deg, var(--blue-neon), var(--pink-neon)); color:#000; border:none; padding:12px; margin-top:8px; border-radius:6px; font-weight:900; cursor:pointer; }
    .shot-btn { background:var(--green-neon); margin-top:10px; }
    .shot-btn.shot { background:#555; }

    /* LOG TAB */
    .log-item { background:#111; padding:10px; border-radius:6px; margin-bottom:8px; font-size:12px; }
    .log-item.done { border-left:3px solid var(--green-neon); }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo"><h1>INEVITABLE <span style="color:var(--blue-neon)">FILM</span></h1></div>
        <div class="scene-count" id="progress">0/12 SCENES</div>
    </div>

    <div class="top-tabs">
        <button class="tab-btn active" onclick="openTab('castTab')">👥 CAST</button>
        <button class="tab-btn" onclick="openTab('scriptTab')">🎬 SCRIPT</button>
        <button class="tab-btn" onclick="openTab('logTab')">📋 SHOTS LOG</button>
    </div>

    <!-- TAB 1: CAST -->
    <div id="castTab" class="tab-content active">
        <h3 style="color:var(--pink-neon); margin-bottom:10px;">CHAGUA MHUSIKA MKUU</h3>
        <div class="actor-grid">
            <div class="actor-card" onclick="selectActor('ZORAVALY', this)"><img src="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png"><div>ZORAVALY</div></div>
            <div class="actor-card" onclick="selectActor('PAUL', this)"><img src="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png"><div>PAUL</div></div>
            <div class="actor-card" onclick="selectActor('SHANIYA', this)"><img src="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png"><div>SHANIYA</div></div>
            <div class="actor-card" onclick="selectActor('IRENE', this)"><img src="https://i.postimg.cc/vZsmk4BF/file-00000805881f4b4bebbc524a36936.png"><div>IRENE</div></div>
        </div>
    </div>

    <!-- TAB 2: SCRIPT -->
    <div id="scriptTab" class="tab-content">
        <div id="scenesContainer"></div>
    </div>

    <!-- TAB 3: LOG -->
    <div id="logTab" class="tab-content">
        <h3 style="color:var(--pink-neon); margin-bottom:10px;">MAENDELEO YA KUPIGA</h3>
        <div id="shotLog"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let selectedActor = "";
    let shotScenes = [];
    const totalScenes = 12;

    const scenes = [
        {id:1, title:"SCENE 1: MKUTANO WA USIKU", dialogue:"ZORAVALY: Nimechoka na maisha haya. PAUL: Basi njoo na mimi.", choices:["Kubali kwenda","Kataa"]},
        {id:2, title:"SCENE 2: NYUMBA YA SIRI", dialogue:"SHANIYA: Hapa ndipo tulipoficha pesa. IRENE: Polisi wanakuja!", choices:["Ficha pesa","Kimbia"]},
        {id:3, title:"SCENE 3: MAUAZI", dialogue:"ZORAVALY: Huu ndio mwisho wetu. PAUL: Hapana, bado tuna tumaini.", choices:["Pigana","Jisalimisha"]},
        // Ongeza mpaka scene 12 hapa
    ];

    function openTab(tabId){
        document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        if(tabId === 'scriptTab') loadScenes();
        if(tabId === 'logTab') loadLog();
    }

    function selectActor(name, el){
        selectedActor = name;
        document.querySelectorAll('.actor-card').forEach(c=>c.classList.remove('active'));
        el.classList.add('active');
        alert(`MHUSIKA MKUU: ${name} AMECHAGULIWA`);
    }

    function loadScenes(){
        let container = document.getElementById('scenesContainer');
        container.innerHTML = "";
        scenes.forEach(scene=>{
            let isShot = shotScenes.includes(scene.id);
            container.innerHTML += `
                <div class="scene-box">
                    <div class="scene-title">${scene.title}</div>
                    <div class="dialogue">${scene.dialogue}</div>
                    <button class="choice-btn" onclick="alert('Choice: ${scene.choices[0]}')">A: ${scene.choices[0]}</button>
                    <button class="choice-btn" onclick="alert('Choice: ${scene.choices[1]}')">B: ${scene.choices[1]}</button>
                    <button class="choice-btn shot-btn ${isShot?'shot':''}" onclick="markShot(${scene.id}, this)">
                        ${isShot ? '✓ SHOT IMEPIGWA' : 'MARK AS SHOT'}
                    </button>
                </div>
            `;
        });
    }

    function markShot(id, btn){
        if(!shotScenes.includes(id)){
            shotScenes.push(id);
            db.ref("inevitable_shots").push({scene:id, actor:selectedActor, time:Date.now()});
        } else {
            shotScenes = shotScenes.filter(s=>s!==id);
        }
        btn.classList.toggle('shot');
        btn.innerText = shotScenes.includes(id) ? '✓ SHOT IMEPIGWA' : 'MARK AS SHOT';
        document.getElementById('progress').innerText = `${shotScenes.length}/${totalScenes} SCENES`;
    }

    function loadLog(){
        let log = document.getElementById('shotLog');
        log.innerHTML = "";
        shotScenes.forEach(id=>{
            let s = scenes.find(x=>x.id===id);
            log.innerHTML += `<div class="log-item done">✓ ${s.title} - Mhusika: ${selectedActor}</div>`;
        });
        if(shotScenes.length===0) log.innerHTML = "<p style='color:#888'>Bado hujapiga scene yoyote</p>";
    }

    // Load shot progress from Firebase
    db.ref("inevitable_shots").once("value", snap=>{
        snap.forEach(child=> shotScenes.push(child.val().scene));
        document.getElementById('progress').innerText = `${shotScenes.length}/${totalScenes} SCENES`;
    });
</script>
</body>
</html>
